<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Kids AI & Homework Helper</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f0fdf4; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .app-card { background: #ffffff; width: 100%; max-width: 500px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 2px solid #bbf7d0; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: #15803d; margin: 0; font-size: 22px; }
    .header p { color: #166534; font-size: 13px; margin-top: 4px; }
    .quick-subjects { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .sub-btn { background: #dcfce7; color: #166534; border: 1px solid #86efac; border-radius: 20px; padding: 6px 12px; font-weight: bold; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .sub-btn:hover { background: #bbf7d0; }
    .chat-box { background: #fafafa; border: 1px solid #e5e7eb; height: 320px; border-radius: 12px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
    .msg { margin-bottom: 10px; max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
    .ai-msg { background: #e0e7ff; color: #1e1b4b; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user-msg { background: #16a34a; color: white; margin-left: auto; border-bottom-right-radius: 2px; text-align: right; }
    .input-group { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
    input:focus { border-color: #16a34a; }
    button { background: #16a34a; color: white; border: none; padding: 0 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    button:hover { background: #15803d; }
    .badge { background: #fef08a; color: #854d0e; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <h2>🎓 Junior AI Tutor <span class="badge">Safe Search</span></h2>
    <p>Ask anything about schoolwork, science, history & math!</p>
  </div>

  <!-- Quick Subject Shortcuts -->
  <div class="quick-subjects">
    <button class="sub-btn" onclick="quickAsk('Explain photosyntehsis simply')">🌿 Science</button>
    <button class="sub-btn" onclick="quickAsk('How do fractions work?')">📐 Math</button>
    <button class="sub-btn" onclick="quickAsk('Who built the pyramids?')">🏛️ History</button>
    <button class="sub-btn" onclick="quickAsk('What is a web browser?')">💻 ICT</button>
  </div>

  <!-- Chat Area -->
  <div class="chat-box" id="chat">
    <div class="msg ai-msg">
      Hello! I am your Safe Learning AI Assistant 🤖. What are we studying or searching for today?
    </div>
  </div>

  <!-- Input Form -->
  <div class="input-group">
    <input type="text" id="userInput" placeholder="Search or ask homework questions..." onkeypress="handleKey(event)">
    <button onclick="sendQuestion()">Ask</button>
  </div>
</div>

<script>
  // Content Safety Filter
  const BLOCKED_WORDS = ["games", "hack", "buy", "cheat", "violence", "adult", "weapon"];

  function handleKey(e) {
    if (e.key === 'Enter') sendQuestion();
  }

  function quickAsk(text) {
    document.getElementById('userInput').value = text;
    sendQuestion();
  }

  function appendMessage(text, sender) {
    const chat = document.getElementById('chat');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
    msgDiv.innerText = text;
    chat.appendChild(msgDiv);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendQuestion() {
    const input = document.getElementById('userInput');
    const query = input.value.trim();

    if (!query) return;

    appendMessage(query, 'user');
    input.value = '';

    // Step 1: Safety Filter Check
    const isUnsafe = BLOCKED_WORDS.some(word => query.toLowerCase().includes(word));
    if (isUnsafe) {
      setTimeout(() => {
        appendMessage("⚠️ I can only help with schoolwork and educational topics! Please ask a study or science question.", 'ai');
      }, 500);
      return;
    }

    // Step 2: Show thinking status
    appendMessage("Thinking and searching safely...", 'ai');

    // Step 3: Process Educational AI Answer
    setTimeout(() => {
      // Remove loading message
      const chat = document.getElementById('chat');
      chat.removeChild(chat.lastChild);

      const response = generateKidSafeResponse(query);
      appendMessage(response, 'ai');
    }, 1000);
  }

  // Kid-Friendly Educational Knowledge Base
  function generateKidSafeResponse(q) {
    const text = q.toLowerCase();

    if (text.includes("photosynthesis") || text.includes("plant")) {
      return "🌿 Photosynthesis is how plants make food using sunlight, water, and air (carbon dioxide)! They produce oxygen, which helps us breathe!";
    } else if (text.includes("fraction") || text.includes("math")) {
      return "📐 A fraction is part of a whole! Imagine cutting a pizza into 4 slices. If you eat 1 slice, you ate 1/4 (one-fourth) of the pizza.";
    } else if (text.includes("browser") || text.includes("internet")) {
      return "💻 A web browser (like Google Chrome or Firefox) is software that reads web pages and displays them on your phone or computer screen.";
    } else if (text.includes("pyramid") || text.includes("history")) {
      return "🏛️ The ancient Egyptians built pyramids thousands of years ago as monumental tombs for their Pharaohs (kings). The Great Pyramid of Giza is the largest!";
    } else {
      return `📚 Great school question about "${q}"! Remember: when searching for schoolwork, always focus on main facts, definitions, and clear examples to explain your work.`;
    }
  }
</script>

</body>
</html>
